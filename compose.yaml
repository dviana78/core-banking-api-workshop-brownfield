services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  migrate:
    build: .
    image: corebanking-workshop:local
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Workshop
      ConnectionStrings__Banking: "Server=sqlserver,1433;Database=CoreBankingWorkshop;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
  api:
    image: corebanking-workshop:local
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Workshop
      ConnectionStrings__Banking: "Server=sqlserver,1433;Database=CoreBankingWorkshop;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Workshop__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Workshop__ClientSecret: ${WORKSHOP_CLIENT_SECRET:-workshop-only}
      Workshop__RateLimit: ${RATE_LIMIT:-500}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  sql-data: